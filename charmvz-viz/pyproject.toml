[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "charmvz-vis"
version = "0.1.0"
description = "Visualization and analysis library for CharmVZ Parquet trace data"
readme = "README.org"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Christian Asch Burgos" },
]
dependencies = [
    "polars>=1.0",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
interactive = ["plotly>=5.18", "ipywidgets>=8.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/charmvz_vis"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
